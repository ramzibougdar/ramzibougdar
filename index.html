<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramzi Bougdar – AI Developer &amp; E-commerce Expert | CV</title>
  <meta name="description" content="CV of Ramzi Bougdar, full stack developer: AI applications with Claude and PrestaShop &amp; Shopify e-commerce. Available in English and French.">
  <meta name="color-scheme" content="light dark">
  <!-- Canonical, language alternates and social cards, generated by scripts/generate-metadata.js -->
  <link rel="canonical" href="https://ramzibougdar.github.io/">
  <link rel="alternate" hreflang="en" href="https://ramzibougdar.github.io/en/">
  <link rel="alternate" hreflang="fr" href="https://ramzibougdar.github.io/fr/">
  <link rel="alternate" hreflang="x-default" href="https://ramzibougdar.github.io/">
  <!-- /generated links -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!--
    Language router: sends the visitor to the stored language, otherwise to French when the
    browser prefers French, otherwise to English (the default). The query string and the
    anchor are kept, so old links such as /#contact still land on the right section.
  -->
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) { /* storage unavailable */ }
      if (lang !== 'en' && lang !== 'fr') {
        var preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        lang = /^fr\b/i.test(preferred[0] || '') ? 'fr' : 'en';
      }
      // Opened from the disk (file://), a folder URL would list its files: target the page itself.
      var page = window.location.protocol === 'file:' ? 'index.html' : '';
      window.location.replace(lang + '/' + page + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem; font: 500 1.125rem/1.5 system-ui, sans-serif; background: #F4F4F8; color: #15162E; text-align: center; }
    a { color: #5B3DF5; font-weight: 700; }
    @media (prefers-color-scheme: dark) { body { background: #0D0E1A; color: #ECEDF7; } a { color: #8B78FF; } }
  </style>
</head>
<body>
  <!-- Shown only when JavaScript is off (or while the redirect happens) -->
  <h1>Ramzi Bougdar — CV</h1>
  <p><a href="en/" hreflang="en">English version</a> · <a href="fr/" hreflang="fr" lang="fr">Version française</a></p>
</body>
</html>
